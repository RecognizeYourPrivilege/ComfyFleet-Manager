<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ComfyFleet shell</title>
  <link rel="icon" href="/comfyfleet-logo-ships.jpg">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7; }
    body { display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 14px; background: #1c1c1e; }
    a { color: #0a84ff; }
    #status { color: rgba(235, 235, 245, 0.62); font-size: 13px; }
    #term { flex: 1; min-height: 0; padding: 8px; }
  </style>
</head>
<body>
  <header>
    <strong id="title">Shell</strong>
    <span id="status">Connecting…</span>
    <a href="/">Fleet</a>
  </header>
  <div id="term"></div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit.js"></script>
  <script src="/terminal.js"></script>
</body>
</html>
